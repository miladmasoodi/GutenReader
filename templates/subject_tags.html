{% extends "base.html" %}
{% load bootstrap_icons %}
{% block Title %} {{ Title }} {% endblock %}
{% block Content %}
    <h2 class="text-center pt-3 pb-1 text-primary-emphasis display-5">
        {{ page_header }}
    </h2>
    <hr class="w-75" style="color: #be6900">
    
    <div
        style="min-height: 40rem;">
        <div class="container row justify-content-center px-4">
            {% for tag in tags %}
                <div class="row shadow-md m-2 p-2 ps-3 border bg-light rounded-pill border-white border-2"
                     style="max-width: 24rem; height: 3.25rem; background-color: #fffefd">
                    <div class="col-10 border-2 width-100 height-100 border-white border-end ps-1 pe-0">
                        <a class="nav-link  width-100 height-100 fs-5 text-truncate pe-0 text-dark"
                           href="{{ tag.0.get_absolute_url }}">
                            {{ tag.1 }}
                        </a>
                    </div>
                    <div class="col-2 p-0">
                        <a class="nav-link fw-bold width-100 height-100 fs-5 px-0 text-center text-primary"
                           href="{{ tag.0.get_absolute_url }}">
                            {{ tag.2 }}
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>


{% endblock %}
