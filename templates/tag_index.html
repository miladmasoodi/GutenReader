{% extends "base.html" %}
{%  block Title %} {{ Title }} {% endblock %}
{%  block Content %}

  <div class="row justify-content-center ">
    <h2 class="p-2 text-primary-emphasis text-center display-5 mb-0">{{ tag.content }}</h2>
    <hr class="w-75 d-md-none" 
        style="color: #be6900">
    <hr class="w-50 d-none d-md-block" 
        style="color: #be6900">
    <div class="col-11 col-md-10 col-lg-9 col-xl-8 shadow bg-light border border-2 border-white p-2 rounded-4"  
         style="min-height: 40rem;">
        <table class="table table-hover p-2 m-0 table-light text-center">
          <thead>
            <tr>
              <th class="fs-3 fw-normal text-muted">
                Books tagged with <span class="text-dark fst-italic">{{ tag.content }}</span>
              </th>
            </tr>
          </thead>
          <tbody class="">
            {% for book in books %}
              <tr class="border-bottom">
                    <td class="p-1 ps-3">
                        <a class=" nav-link width-100 height-100 text-primary fs-4"
                           href="{{book.get_absolute_url}}"> {{ book.title }}
                        </a>
                    </td>
                </tr>
            {% endfor %}
          </tbody>
        </table>
    </div>
  <div>

  </div>
  </div>
{% endblock %}
